{% extends 'base.html' %}
{% block titulito %}Error {{ codigo }} – Cleoferr{% endblock %}
{% block contenido %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm text-center" style="border-radius:12px">
        <div class="card-body py-5">
          <h1 class="fw-bold mb-2" style="font-size:3.5rem;color:var(--naranja)">{{ codigo }}</h1>
          <p class="text-muted mb-4">{{ mensaje }}</p>
          <a href="/" class="btn btn-naranja fw-bold">
            <i class="fa fa-home me-1"></i>Volver al inicio
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
